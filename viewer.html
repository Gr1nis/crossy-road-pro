  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- Module: src/core/types.ts ---
const LaneType = {
  GRASS: 'GRASS',
  ROAD: 'ROAD',
  RIVER: 'RIVER',
  RAILWAY: 'RAILWAY',
}         ;
const MoveDirection = {
  FORWARD: 'FORWARD',
  BACKWARD: 'BACKWARD',
  LEFT: 'LEFT',
  RIGHT: 'RIGHT',
}         ;
const DeathReason = {
  NONE: 'NONE',
  CAR: 'CAR',
  TRAIN: 'TRAIN',
  WATER: 'WATER',
  OUT_OF_BOUNDS: 'OUT_OF_BOUNDS',
  CAMERA_BEHIND: 'CAMERA_BEHIND',
}         ;
const DEFAULT_SKIN_ID         = 'corgi';
const ALL_SKINS                                                             = [
  { id: 'corgi', name: 'Весёлый Корги', badge: '🐶' },
  { id: 'pigeon_pizza', name: 'Пицца-Голубь', badge: '🐦' },
  { id: 'box_cat', name: 'Кот в коробке', badge: '📦' },
  { id: 'raccoon_bandit', name: 'Енот-воришка', badge: '🦝' },
  { id: 'capybara_zen', name: 'Дзен-Капибара', badge: '🍊' },
];
const Biome = {
  FOREST: 'forest',
  WINTER: 'winter',
  DESERT: 'desert',
  NEON: 'neon',
}         ;
const BIOME_ORDER                           = [
  Biome.FOREST,
  Biome.WINTER,
  Biome.DESERT,
  Biome.NEON,
];
const BIOME_INTERVAL = 25;
function getBiomeForScore(score        )            {
  const safeScore = Number.isFinite(score) ? Math.max(0, Math.floor(score)) : 0;
  const biomeIndex = Math.floor(safeScore / BIOME_INTERVAL) % BIOME_ORDER.length;
  return BIOME_ORDER[biomeIndex];
}
const WORLD_CONFIG = {
  MIN_X: -9,
  MAX_X: 9,
  OUT_OF_BOUNDS_X: 9.6,
  WRAP_LIMIT: 22,
  HOP_DURATION: 0.12,
  PLAYER_WIDTH: 0.65,
  LOG_MARGIN: 0.12,
  CAMERA_BACK_LIMIT: 18.0,
  CAMERA_GRACE_PERIOD: 0.4,
  BASE_CAMERA_SPEED: 0.85,
  GACHA_COST: 100,
  BIOME_INTERVAL: 25,
  CAMERA_OFFSET: {
    X: -7.5,
    Y: 12.5,
    Z: -7.5,
  },
  FRUSTUM_SIZE: 11,
}         ;

// --- Module: src/core/collision.ts ---
function checkVehicleCollision(playerX        , vehicles           )                 {
  for (const v of vehicles) {
    const halfSpan = (WORLD_CONFIG.PLAYER_WIDTH + v.length) / 2;
    if (Math.abs(playerX - v.x) < halfSpan) {
      return v;
    }
  }
  return null;
}
function findSupportingLog(playerX        , logs               )                     {
  for (const log of logs) {
    const halfLen = log.length / 2 + WORLD_CONFIG.LOG_MARGIN;
    if (Math.abs(playerX - log.x) <= halfLen) {
      return log;
    }
  }
  return null;
}

/**
 * Snaps candidate landing X on a log to the nearest discrete segment slot [-1.0, 0, +1.0]
 * relative to the center of the log, so the character cleanly magnets to a log section.
 */
function snapToLogSlot(landingX        , log             )         {
  const rel = landingX - log.x;
  // Discrete 1.0-spaced slots centered on log
  const snappedRel = Math.round(rel);
  const maxRel = Math.max(0, (log.length - 1.0) / 2);
  const clampedRel = Math.max(-maxRel, Math.min(maxRel, snappedRel));
  return log.x + clampedRel;
}
function isOutOfBoundsX(playerX        )          {
  return Math.abs(playerX) > WORLD_CONFIG.OUT_OF_BOUNDS_X;
}
function quantizeLandX(x        )         {
  const rounded = Math.round(x);
  return Math.max(WORLD_CONFIG.MIN_X, Math.min(WORLD_CONFIG.MAX_X, rounded));
}

/**
 * Maps logical world X coordinate to Three.js right-handed X coordinate
 * (where camera looks toward +Z, so screen-right is -X and screen-left is +X).
 */
function worldToScreenX(x        )         {
  return x === 0 ? 0 : -x;
}
function vehicleScreenRotationY(speed        )         {
  return speed > 0 ? Math.PI : 0;
}
const RECORD_FLAG_X = 3.8;
function getRecordFlagPosition(
  highScore        ,
  shoulderX         = RECORD_FLAG_X
)                            {
  if (!Number.isFinite(highScore) || highScore <= 0) {
    return null;
  }
  return {
    x: shoulderX,
    row: Math.floor(highScore),
  };
}
const CAMERA_CONFIG = {
  MOBILE_VIEW_HEIGHT: 15.0,
  DESKTOP_VIEW_HEIGHT: 12.5,
  PLAYER_SCREEN_Y_RATIO: 0.28,
  BASE_PLAYER_VIEW_Y: -0.44,
  MAX_PAN_CORRIDOR_HALF: 10.0,
  FRUSTUM_EDGE_NDC_THRESHOLD: -0.98,
}         ;
function getCameraFrustumDimensions(aspect         = 9 / 16)   
                     
                    
                 
              
  {
  const t = Math.max(0, Math.min(1, (aspect - 0.5625) / (1.7778 - 0.5625)));
  const viewHeight =
    CAMERA_CONFIG.MOBILE_VIEW_HEIGHT +
    t * (CAMERA_CONFIG.DESKTOP_VIEW_HEIGHT - CAMERA_CONFIG.MOBILE_VIEW_HEIGHT);
  const halfWidth = (viewHeight * aspect) / 2;
  const bottom =
    CAMERA_CONFIG.BASE_PLAYER_VIEW_Y -
    CAMERA_CONFIG.PLAYER_SCREEN_Y_RATIO * viewHeight;
  const top = bottom + viewHeight;
  return { viewHeight, halfWidth, bottom, top };
}

/**
 * Calculates normalized device coordinate (NDC) Y [-1.0..1.0] for the top-most visible vertex
 * of the player character under the isometric orthographic camera.
 * -1.0 corresponds strictly to the bottom visible edge of the screen viewport.
 */
function getCameraFrustumNdcY(
  playerX        ,
  playerRow        ,
  camZ        ,
  aspect         = 9 / 16
)         {
  const sx = -playerX + 0.35;
  const sy = 0.65;
  const sz = playerRow + 0.35;
  const dx = sx - WORLD_CONFIG.CAMERA_OFFSET.X;
  const dy = sy - WORLD_CONFIG.CAMERA_OFFSET.Y;
  const dz = sz - camZ - WORLD_CONFIG.CAMERA_OFFSET.Z;
  const vy =
    dx * 0.42426406871192857 +
    dy * 0.7071067811865476 +
    dz * 0.565685424949238;
  const { viewHeight, bottom } = getCameraFrustumDimensions(aspect);
  return (2 * (vy - bottom)) / viewHeight - 1.0;
}

/**
 * Returns true when the player touches or crosses below the visible
 * bottom edge of the screen (NDC Y < -0.98).
 */
function isPlayerBehindCameraFrustum(
  playerX        ,
  playerRow        ,
  camZ        ,
  aspect         = 9 / 16
)          {
  return getCameraFrustumNdcY(playerX, playerRow, camZ, aspect) < CAMERA_CONFIG.FRUSTUM_EDGE_NDC_THRESHOLD;
}

// --- Module: src/view/voxelPalette.ts ---
const VOXEL_PALETTE = {
  // 16 Standard Color Palette
  corgiOrange: 0xd97706,
  white: 0xffffff,
  capybaraBrown: 0x78350f,
  orangeFruit: 0xf97316,
  pigeonGrey: 0x64748b,
  purpleNeck: 0x8b5cf6,
  pizzaRed: 0xb91c1c,
  pizzaCheese: 0xfacc15,
  catOrange: 0xea580c,
  cardboard: 0xb45309,
  raccoonGrey: 0x475569,
  maskBlack: 0x0f172a,
  darkCharcoal: 0x1e293b,
  nosePink: 0xf472b6,
  greenLeaf: 0x16a34a,
  ghostYellow: 0xfbbf24,
  burlapBag: 0xd4b285,
  bagRope: 0x854d0e,
  capybaraCaramel: 0x925227,
  capybaraMuzzle: 0x542d13,
  capybaraPaws: 0x2b170a,
  pigeonFootRed: 0xf43f5e,
  deliveryRed: 0xdc2626,
  catStripe: 0x9a3412,
  boxFlap: 0x92400e,

  // Backward compatibility & environment aliases
  corgiTan: 0xd97706,
  corgiWhite: 0xffffff,
  corgiNose: 0x1e293b,
  corgiTongue: 0xf472b6,
  corgiCollar: 0xb91c1c,
  corgiGold: 0xfacc15,
  pigeonDark: 0x1e293b,
  pigeonBeak: 0xf97316,
  pigeonTeal: 0x8b5cf6,
  pizzaCrust: 0xb45309,
  pizzaPepperoni: 0xb91c1c,
  boxTan: 0xb45309,
  boxTape: 0xf97316,
  catWhite: 0xffffff,
  catNose: 0xf472b6,
  catEye: 0xfacc15,
  raccoonDark: 0x0f172a,
  raccoonWhite: 0xffffff,
  sodaSilver: 0x64748b,
  capybaraDark: 0x1e293b,
  mandarinOrange: 0xf97316,
  mandarinLeaf: 0x16a34a,
  hydrantRed: 0xb91c1c,
  woodLight: 0xd97706,
  concreteGrey: 0x64748b,
  goldCoin: 0xfacc15,
  rubyRed: 0xb91c1c,
}         ;
class VoxelPalette {
          static          geoCache = new Map                           ();
          static          matCache = new Map                                   ();
          static          basicMatCache = new Map                                 ();
          static ghostMaterial                                   = null;

  static getGhostMaterial()                            {
    if (!VoxelPalette.ghostMaterial) {
      VoxelPalette.ghostMaterial = new THREE.MeshLambertMaterial({
        color: VOXEL_PALETTE.ghostYellow,
        transparent: true,
        opacity: 0.42,
      });
    }
    return VoxelPalette.ghostMaterial;
  }

  static getMaterial(
    colorKey                        ,
    isGhost = false
  )                            {
    if (isGhost) {
      return VoxelPalette.getGhostMaterial();
    }
    const hex = typeof colorKey === 'number' ? colorKey : VOXEL_PALETTE[colorKey];
    let mat = VoxelPalette.matCache.get(hex);
    if (!mat) {
      mat = new THREE.MeshLambertMaterial({ color: hex });
      VoxelPalette.matCache.set(hex, mat);
    }
    return mat;
  }

  static getBasicMaterial(
    color        ,
    transparent = false,
    opacity = 1.0
  )                          {
    const key = `${color}_${transparent ? 1 : 0}_${opacity}`;
    let mat = VoxelPalette.basicMatCache.get(key);
    if (!mat) {
      mat = new THREE.MeshBasicMaterial({ color, transparent, opacity });
      VoxelPalette.basicMatCache.set(key, mat);
    }
    return mat;
  }

  static getBox(w        , h        , d        )                    {
    const key = `${w}_${h}_${d}`;
    let geo = VoxelPalette.geoCache.get(key);
    if (!geo) {
      geo = new THREE.BoxGeometry(w, h, d);
      VoxelPalette.geoCache.set(key, geo);
    }
    return geo;
  }
}

// Pre-populate standard geometries and materials to avoid runtime allocations
const voxelStandardSizes                             = [
  [0.1, 0.1, 0.1],
  [0.14, 0.14, 0.14],
  [0.2, 0.2, 0.2],
  [0.3, 0.3, 0.3],
  [0.4, 0.4, 0.4],
  [0.5, 0.5, 0.5],
  [0.6, 0.6, 0.6],
  [0.1, 0.14, 0.12],
  [0.14, 0.04, 0.22],
];

for (const [w, h, d] of voxelStandardSizes) {
  VoxelPalette.getBox(w, h, d);
}

for (const key of Object.keys(VOXEL_PALETTE)                   ) {
  VoxelPalette.getMaterial(key, false);
}
VoxelPalette.getGhostMaterial();
function createVoxelMaterial(
  colorKey                        ,
  isGhost = false
)                            {
  return VoxelPalette.getMaterial(colorKey, isGhost);
}
function createVoxelBasicMaterial(
  color        ,
  transparent = false,
  opacity = 1.0
)                          {
  return VoxelPalette.getBasicMaterial(color, transparent, opacity);
}
function createVoxelMesh(
  w        ,
  h        ,
  d        ,
  mat                ,
  x = 0,
  y = 0,
  z = 0,
  castShadow = true,

const urbanGeoCache = new Map                           ();
const urbanMatCache = new Map                        ();

function getUrbanGeo(w        , h        , d        )                    {
  const key = `${w}_${h}_${d}`;
  let geo = urbanGeoCache.get(key);
  if (!geo) {
    geo = new THREE.BoxGeometry(w, h, d);
    urbanGeoCache.set(key, geo);
  }
  return geo;
}

function getUrbanMat(
  color        ,
  basic = false,
  transparent = false,
  opacity = 1.0
)                 {
  const key = `${color}_${basic ? 1 : 0}_${transparent ? 1 : 0}_${opacity}`;
  let mat = urbanMatCache.get(key);
  if (!mat) {
    mat = basic
      ? new THREE.MeshBasicMaterial({ color, transparent, opacity })
      : new THREE.MeshLambertMaterial({ color, transparent, opacity });
    urbanMatCache.set(key, mat);
  }
  return mat;
}

                       
              
              
              
              
              
              
                  
                             
                     
  

function buildUrbanVoxels(group             , specs                  )       {
  for (let i = 0; i < specs.length; i++) {
    const s = specs[i];
    const transparent = (s[8] ?? 1.0) < 1.0;
    const mesh = new THREE.Mesh(
      getUrbanGeo(s[0], s[1], s[2]),
      getUrbanMat(s[6], !!s[7], transparent, s[8] ?? 1.0)
    );
    mesh.position.set(s[3], s[4], s[5]);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);
  }
}

    [0.38, 0.05, 0.38, 0.94, 0.075, -0.38, brushCore],
    [0.48, 0.05, 0.48, 0.94, 0.025, -0.38, brushBristle],

    // Municipal Orange Cab Body, Front Grille, Headlights & Handles
    [0.72, 0.28, 0.70, 0.44, 0.34, 0, cabOrange],
    [0.03, 0.10, 0.12, 0.81, 0.34, 0.24, headlight, true],
    [0.03, 0.10, 0.12, 0.81, 0.34, -0.24, headlight, true],
    [0.03, 0.08, 0.26, 0.81, 0.34, 0, 0xc2410c],
    [0.06, 0.03, 0.03, 0.36, 0.36, 0.365, 0x0f172a],

    // Solid Contrast Black Hazard Band Plate (Z = +/-0.375)
    [0.96, 0.12, 0.03, -0.48, 0.34, 0.375, hazardDark],
    [0.96, 0.12, 0.03, -0.48, 0.34, -0.375, hazardDark],
  ];

  // Alternating Hazard Chevrons (Yellow Slanted Slashes sitting cleanly at Z = +/-0.395)
  for (let x = -0.08; x >= -0.88; x -= 0.13) {
    specs.push([0.05, 0.055, 0.02, x, 0.31, 0.395, hazardYellow, true]);
    specs.push([0.05, 0.055, 0.02, x - 0.035, 0.365, 0.395, hazardYellow, true]);
    specs.push([0.05, 0.055, 0.02, x, 0.31, -0.395, hazardYellow, true]);
    specs.push([0.05, 0.055, 0.02, x - 0.035, 0.365, -0.395, hazardYellow, true]);
  }

  // Relief "STREET SWEEP" Typography (Clean non-overlapping macro glyph blocks at Z = +/-0.375)
  const addGlyph = (type        , cx        , cy        ) => {
    const addBox = (w        , h        , x        , y        ) => {
      specs.push([w, h, 0.03, x, y, 0.375, labelWhite, true]);
      specs.push([w, h, 0.03, x, y, -0.375, labelWhite, true]);
    };
    if (type === 'S') {
      addBox(0.08, 0.02, cx, cy + 0.04);
      addBox(0.08, 0.02, cx, cy);
      addBox(0.08, 0.02, cx, cy - 0.04);
      addBox(0.025, 0.02, cx - 0.0275, cy + 0.02);
      addBox(0.025, 0.02, cx + 0.0275, cy - 0.02);
    } else if (type === 'T') {
      addBox(0.08, 0.02, cx, cy + 0.04);
      addBox(0.025, 0.08, cx, cy - 0.01);
    } else if (type === 'R') {
      addBox(0.025, 0.10, cx - 0.0275, cy);
      addBox(0.055, 0.02, cx + 0.0125, cy + 0.04);
      addBox(0.055, 0.02, cx + 0.0125, cy);
      addBox(0.025, 0.02, cx + 0.0275, cy + 0.02);
      addBox(0.025, 0.04, cx + 0.0275, cy - 0.03);
    } else if (type === 'E') {
      addBox(0.025, 0.10, cx - 0.0275, cy);
      addBox(0.055, 0.02, cx + 0.0125, cy + 0.04);
      addBox(0.045, 0.02, cx + 0.0075, cy);
      addBox(0.055, 0.02, cx + 0.0125, cy - 0.04);
    } else if (type === 'W') {
      addBox(0.025, 0.10, cx - 0.035, cy);
      addBox(0.025, 0.10, cx + 0.035, cy);
      addBox(0.02, 0.06, cx, cy - 0.02);
      addBox(0.09, 0.02, cx, cy - 0.04);
    } else if (type === 'P') {
      addBox(0.025, 0.10, cx - 0.0275, cy);
      addBox(0.055, 0.02, cx + 0.0125, cy + 0.04);
      addBox(0.055, 0.02, cx + 0.0125, cy);
      addBox(0.025, 0.02, cx + 0.0275, cy + 0.02);
    }
  };

  const streetWord = 'STREET';
  for (let i = 0; i < streetWord.length; i++) {
    addGlyph(streetWord[i], -0.16 - i * 0.11, 0.63);
  }
  const sweepWord = 'SWEEP';
  for (let i = 0; i < sweepWord.length; i++) {
    addGlyph(sweepWord[i], -0.21 - i * 0.11, 0.50);
  }

  return specs;
}

function createUrbanVehicle(
  vOrType                                                           ,
  speed         ,
  colorOverride         
)              {
  const group = new THREE.Group();
  let specs                  ;
  let spd        ;

  if (typeof vOrType === 'object') {
    spd = vOrType.speed;
    const col = vOrType.color;
    if (vOrType.type === 'truck') {
      specs = Math.abs(vOrType.id) % 2 === 0 ? buildBus(col) : buildSweeper(col);
    } else {
      specs = Math.abs(vOrType.id) % 2 === 0 ? buildTaxi(col) : buildScooter(col);
    }
  } else {
    spd = speed ?? 1;
    switch (vOrType) {
      case 'taxi': specs = buildTaxi(colorOverride ?? 0xeab308); break;
      case 'scooter': specs = buildScooter(colorOverride ?? 0x3b82f6); break;
      case 'bus': specs = buildBus(colorOverride ?? 0x38bdf8); break;
      case 'sweeper': specs = buildSweeper(colorOverride ?? 0xf97316); break;
      case 'train': return createUrbanTrain(spd);
      default: specs = buildTaxi(colorOverride ?? 0xeab308); break;
    }
  }

  buildUrbanVoxels(group, specs);
  group.rotation.y = vehicleScreenRotationY(spd);
  return group;
}
function createUrbanTrain(lengthOrSpeed         = -1, speed         )              {
  const group = new THREE.Group();
  buildUrbanVoxels(group, buildTrain());
  const actualSpeed = speed !== undefined ? speed : lengthOrSpeed;
  group.rotation.y = vehicleScreenRotationY(actualSpeed);
  return group;
}
function createUrbanPallet(log             )              {
  const group = new THREE.Group();
  const timberColor = 0xd97706; // Light timber planks
  const darkWood = 0x78350f;    // Stringers, blocks, stamp
  const foamColor = 0xf8fafc;   // Water foam ripples
  const waterColor = 0x0284c7;  // Submerged keel

  const specs                   = [
    // Submerged buoyancy keel
    [log.length * 0.92, 0.08, 0.68, 0, -0.06, 0, waterColor],
    // White foam wake around floating pallet
    [log.length + 0.16, 0.02, 0.86, 0, -0.02, 0, foamColor, true, 0.85],
    // 3 Longitudinal bottom skids
    [log.length * 0.94, 0.04, 0.12, 0, 0.01, -0.28, darkWood],
    [log.length * 0.94, 0.04, 0.12, 0, 0.01, 0, darkWood],
    [log.length * 0.94, 0.04, 0.12, 0, 0.01, 0.28, darkWood],
  ];

  // 9 Support spacer blocks along pallet length
  const blockXPositions = [-log.length * 0.42, 0, log.length * 0.42];
  for (const bx of blockXPositions) {
    specs.push([0.14, 0.06, 0.12, bx, 0.05, -0.28, darkWood]);
    specs.push([0.14, 0.06, 0.12, bx, 0.05, 0, darkWood]);
    specs.push([0.14, 0.06, 0.12, bx, 0.05, 0.28, darkWood]);
  }

  // 3 Cross stringer beams on top of blocks
  for (const bx of blockXPositions) {
    specs.push([0.10, 0.04, 0.72, bx, 0.10, 0, darkWood]);
  }

  // 5 Top longitudinal timber boards with realistic gaps (Ref: 20_euro_pallet_turnaround.jpg)
  const boardZ = [-0.29, -0.15, 0, 0.15, 0.29];
  for (const bz of boardZ) {
    specs.push([log.length, 0.04, 0.11, 0, 0.14, bz, timberColor]);
  }

  // Burned wood 'PALLET' stamp brand on front board
  specs.push([0.48, 0.042, 0.02, 0, 0.14, 0.35, darkWood]);

  // Discrete 1.0-spaced slot notches for hop magnetism
  const slotCount = Math.floor(log.length);
  for (let s = -Math.floor(slotCount / 2); s <= Math.floor(slotCount / 2); s++) {
    if (Math.abs(s) > 0.1 && Math.abs(s) < log.length / 2 - 0.2) {
      specs.push([0.04, 0.045, 0.74, s, 0.14, 0, 0x92400e]);
    }
  }

  buildUrbanVoxels(group, specs);
  return group;
}

    ? createUrbanTreePlanter(absSeed, biome)
    : createUrbanLampPost();

const buildingGeoCache = new Map                           ();
const buildingMatCache = new Map                        ();

function getBldgGeo(w        , h        , d        )                    {
  const key = `${w.toFixed(2)}_${h.toFixed(2)}_${d.toFixed(2)}`;
  let geo = buildingGeoCache.get(key);
  if (!geo) {
    geo = new THREE.BoxGeometry(w, h, d);
    buildingGeoCache.set(key, geo);
  }
  return geo;
}

function getBldgMat(color        , basic = false)                 {
  const key = `${color}_${basic ? 1 : 0}`;
  let mat = buildingMatCache.get(key);
  if (!mat) {
    mat = basic
      ? new THREE.MeshBasicMaterial({ color })
      : new THREE.MeshLambertMaterial({ color });
    buildingMatCache.set(key, mat);
  }
  return mat;
}

                                                                                    

function buildVoxels(group             , specs             )       {
  for (const [w, h, d, x, y, z, color, basic] of specs) {
    const geo = getBldgGeo(w, h, d);
    const mat = getBldgMat(color, basic ?? false);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);
  }
}

function createUrbanTownhouse(seed        , biome            = 'forest')              {
  const root = new THREE.Group();
  root.name = 'urbanTownhouse';
  const variant = Math.abs(seed) % 3;
  let bldg             ;
  if (variant === 0) bldg = createTownhouseA();
  else if (variant === 1) bldg = createTownhouseB();
  else bldg = createTownhouseC();

  // Special lighting or tinting for night / winter biomes if needed
  if (biome === 'winter') {
    const snowGeo = getBldgGeo(1.48, 0.08, 1.28);
    const snowMat = getBldgMat(0xf8fafc);
    const snowCap = new THREE.Mesh(snowGeo, snowMat);
    snowCap.position.set(0, 3.82, 0);
    bldg.add(snowCap);
  }

  // Center depth around Z=0 and scale so building spans across 2 lanes (depth ~1.62 < 2.0)
  bldg.position.z = -0.1325;
  root.add(bldg);
  root.scale.set(0.95, 0.95, 0.95);
  return root;
}

function getModelDiagnostics(group             )   
                    
               
  {
  let meshCount = 0;
  group.traverse((c) => {
    if ((c              ).isMesh) {
      meshCount++;
    }
  });
  const box = new THREE.Box3().setFromObject(group);
  const w = Math.max(0.01, box.max.x - box.min.x).toFixed(2);
  const h = Math.max(0.01, box.max.y - box.min.y).toFixed(2);
  const d = Math.max(0.01, box.max.z - box.min.z).toFixed(2);
  return { meshCount, dims: `${w} × ${h} × ${d}` };
}
function verifyModelRegistry()   
                
                                           
                   
  {

      }
      const diag = getModelDiagnostics(mesh);
      if (diag.meshCount <= 0) {
        errors.push(`Model "${item.id}" has 0 voxel meshes`);
      }
    } catch (err) {
      const msg = err instanceof Error ? err.message : String(err);
      errors.push(`Model "${item.id}" failed during instantiation: ${msg}`);
    }
  }

  // Ensure every registered character skin in ALL_SKINS has an entry
  for (const skin of ALL_SKINS) {
    const found = catalog.find((m) => m.id === skin.id && m.cat === 'chars');
    if (!found) {
      errors.push(`Skin "${skin.id}" from ALL_SKINS is missing from model catalog!`);
    }
  }

  return {
    total: catalog.length,
    countsByCategory,
    errors,
  };
}



    // === THREE.JS STAGE SETUP ===
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f19);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(3.2, 2.5, 4.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.5, 0);
    controls.maxPolarAngle = Math.PI / 2 + 0.05;

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x1e293b, 0.75);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.25);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.45);
    fillLight.position.set(-6, 4, -4);
    scene.add(fillLight);

    // Floor Pedestal & Grid
    const pedestalGeo = new THREE.CylinderGeometry(2.4, 2.5, 0.1, 48);
    const pedestalMat = new THREE.MeshLambertMaterial({ color: 0x111827 });
    const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
    pedestal.position.y = -0.05;
    pedestal.receiveShadow = true;
    scene.add(pedestal);

    const grid = new THREE.GridHelper(6, 24, 0x0284c7, 0x1e293b);
    grid.position.y = 0.002;
    scene.add(grid);

    // Dynamic Model Registry from Game Code
    const MODELS = getModelCatalog();

    // Current State
    let activeCategory = 'chars';
    let currentModelId = MODELS[0] ? MODELS[0].id : 'corgi';
    let currentMesh = null;
    let autoSpin = true;
    let hopTest = false;
    let ghostMode = false;
    let currentBiome = 'forest';

    // Model Mount Node
    const modelRoot = new THREE.Group();
    scene.add(modelRoot);

    function loadModel(id) {
      currentModelId = id;
      const def = MODELS.find(m => m.id === id) || MODELS[0];
      if (!def) return;

      while (modelRoot.children.length > 0) {
        modelRoot.remove(modelRoot.children[0]);
      }

      currentMesh = def.create(currentBiome, ghostMode);
      modelRoot.add(currentMesh);

      // Center model on pedestal
      const box = new THREE.Box3().setFromObject(currentMesh);
      const center = box.getCenter(new THREE.Vector3());
      currentMesh.position.x = -center.x;
      currentMesh.position.z = -center.z;
      currentMesh.position.y = -box.min.y;

      // Dynamic diagnostics from actual 3D geometry
      const diag = getModelDiagnostics(currentMesh);

      // Update Info Panel
      document.getElementById('info-title').textContent = def.icon + ' ' + def.name;
      document.getElementById('info-category').textContent = def.cat.toUpperCase();
      document.getElementById('info-voxels').textContent = String(diag.meshCount);
      document.getElementById('info-dims').textContent = diag.dims;
      document.getElementById('info-desc').textContent = def.desc;

      // Update sidebar buttons
      document.querySelectorAll('.model-card-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.id === id);
      });
    }

    function renderSidebar() {
      const listEl = document.getElementById('model-list');
      listEl.innerHTML = '';
      const filtered = MODELS.filter(m => m.cat === activeCategory);

      filtered.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'model-card-btn ' + (m.id === currentModelId ? 'active' : '');
        btn.dataset.id = m.id;

        // Quick voxel badge
        let badgeText = '3D';
        try {
          const testGroup = m.create(currentBiome, false);
          const d = getModelDiagnostics(testGroup);
          badgeText = d.meshCount + ' vx';
        } catch {
          badgeText = '3D';
        }

        btn.innerHTML =
          '<div class="model-card-title">' +
            '<span style="font-size: 18px;">' + m.icon + '</span>' +
            '<span>' + m.name + '</span>' +
          '</div>' +
          '<span class="model-card-badge">' + badgeText + '</span>';
        btn.addEventListener('click', () => loadModel(m.id));
        listEl.appendChild(btn);
      });
    }

    // Category Tabs
    document.querySelectorAll('.cat-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeCategory = tab.dataset.cat;
        renderSidebar();
        const first = MODELS.find(m => m.cat === activeCategory);
        if (first) loadModel(first.id);
      });
    });

    // Toolbar Controls
    const btnSpin = document.getElementById('btn-spin');
    btnSpin.addEventListener('click', () => {
      autoSpin = !autoSpin;
      btnSpin.classList.toggle('active', autoSpin);
    });

    const btnHop = document.getElementById('btn-hop');
    btnHop.addEventListener('click', () => {
      hopTest = !hopTest;
      btnHop.classList.toggle('active', hopTest);
      if (!hopTest && modelRoot) {
        modelRoot.scale.set(1, 1, 1);
        modelRoot.position.y = 0;
      }
    });

    const btnGhost = document.getElementById('btn-ghost');
    btnGhost.addEventListener('click', () => {
      ghostMode = !ghostMode;
      btnGhost.classList.toggle('active', ghostMode);
      loadModel(currentModelId);
    });

    const biomeSelect = document.getElementById('biome-select');
    biomeSelect.addEventListener('change', (e) => {
      currentBiome = e.target.value;
      loadModel(currentModelId);
    });

    const lightSelect = document.getElementById('light-select');
    lightSelect.addEventListener('change', (e) => {
      const v = e.target.value;
      if (v === 'studio') {
        scene.background.set(0x0b0f19);
        hemiLight.color.set(0xffffff);
        dirLight.color.set(0xffffff);
        fillLight.color.set(0x38bdf8);
      } else if (v === 'sun') {
        scene.background.set(0x38bdf8);
        hemiLight.color.set(0xbae6fd);
        dirLight.color.set(0xffedd5);
        fillLight.color.set(0x60a5fa);
      } else if (v === 'sunset') {
        scene.background.set(0x4c1d95);
        hemiLight.color.set(0xf472b6);
        dirLight.color.set(0xf97316);
        fillLight.color.set(0x818cf8);
      } else if (v === 'cyber') {
        scene.background.set(0x050510);
        hemiLight.color.set(0x06b6d4);
        dirLight.color.set(0xd946ef);
        fillLight.color.set(0x3b82f6);
      }
    });

    const btnGrid = document.getElementById('btn-grid');
    btnGrid.addEventListener('click', () => {
      grid.visible = !grid.visible;
      btnGrid.classList.toggle('active', grid.visible);
    });

    const btnResetCam = document.getElementById('btn-reset-cam');
    btnResetCam.addEventListener('click', () => {
      camera.position.set(3.2, 2.5, 4.0);
      controls.target.set(0, 0.5, 0);
    });

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation Loop
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsed = clock.getElapsedTime();

      if (autoSpin && modelRoot && !hopTest) {
        modelRoot.rotation.y += delta * 0.8;
      }

      if (hopTest && modelRoot) {
        const cycle = (elapsed * 3.5) % Math.PI;
        const hopHeight = Math.sin(cycle) * 0.45;
        modelRoot.position.y = hopHeight;
        const squish = hopHeight > 0.08 ? 1.15 : 0.90;
        modelRoot.scale.set(1 / Math.sqrt(squish), squish, 1 / Math.sqrt(squish));
      } else if (!hopTest && modelRoot) {
        modelRoot.position.y = 0;
        modelRoot.scale.set(1, 1, 1);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    renderSidebar();
    loadModel(currentModelId);
    animate();
  </script>
</body>
</html>
