  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: #0b0f19; color: #f8fafc; }
    #canvas-container { width: 100%; height: 100%; position: absolute; inset: 0; }

    /* Top Navigation Header */
    .top-header {
      position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 20;
    }
    .brand-box {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 10px 18px; border-radius: 14px; pointer-events: auto; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);

    }
    .nav-btn:hover { background: rgba(30, 41, 59, 0.95); border-color: #38bdf8; transform: translateY(-1px); }

    /* Left Sidebar: Catalog & Categories */
    .sidebar {
      position: absolute; top: 80px; bottom: 80px; left: 16px; width: 310px; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 18px; display: flex; flex-direction: column; overflow: hidden; z-index: 20; box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
    }
    .category-tabs {
      display: flex; gap: 4px; padding: 10px; background: rgba(2, 6, 23, 0.5); border-bottom: 1px solid rgba(255, 255, 255, 0.08); overflow-x: auto;

    .cat-tab {
      padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; border: 1px solid transparent; background: transparent; color: #94a3b8; white-space: nowrap; transition: all 0.15s;

    .cat-tab.active { background: #0284c7; color: #fff; border-color: #38bdf8; }
    
    .model-list {
      flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px;
    }
    .model-list::-webkit-scrollbar { width: 6px; }
    .model-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    .model-card-btn {
      display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 12px; background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255, 255, 255, 0.06); color: #cbd5e1; cursor: pointer; text-align: left; transition: all 0.15s;
    }
    .model-card-btn:hover { background: rgba(51, 65, 85, 0.7); border-color: rgba(255, 255, 255, 0.2); color: #fff; transform: translateX(3px); }
    .model-card-btn.active { background: linear-gradient(135deg, rgba(2, 132, 199, 0.4), rgba(14, 165, 233, 0.2)); border-color: #38bdf8; color: #fff; font-weight: 700; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25); }
    .model-card-title { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .model-card-badge { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; background: rgba(0, 0, 0, 0.4); color: #94a3b8; }

    /* Bottom Toolbar */
    .bottom-bar {
      position: absolute; bottom: 16px; left: 16px; right: 16px; display: flex; justify-content: center; pointer-events: none; z-index: 20;
    }
    .toolbar-dock {
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 8px 16px; border-radius: 18px; display: flex; align-items: center; gap: 12px; pointer-events: auto; box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5); flex-wrap: wrap; justify-content: center;
    }
    .tool-group { display: flex; align-items: center; gap: 6px; border-right: 1px solid rgba(255, 255, 255, 0.1); padding-right: 12px; }
    .tool-group:last-child { border-right: none; padding-right: 0; }
    .tool-btn {
      background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); color: #cbd5e1; font-size: 12px; font-weight: 700; padding: 8px 12px; border-radius: 10px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px;
    }
    .tool-btn:hover { background: rgba(51, 65, 85, 1); color: #fff; border-color: #38bdf8; }
    .tool-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }
    .tool-select {
      background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; font-size: 12px; font-weight: 700; padding: 7px 10px; border-radius: 10px; cursor: pointer; outline: none;
    }

    /* Right Info Panel */
    .info-panel {
      position: absolute; top: 80px; right: 16px; width: 280px; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 18px; padding: 18px; z-index: 20; box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
    }
    .info-title { font-size: 17px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .info-category { font-size: 11px; text-transform: uppercase; font-weight: 800; color: #38bdf8; letter-spacing: 0.06em; margin-bottom: 12px; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .info-item { background: rgba(2, 6, 23, 0.4); border: 1px solid rgba(255, 255, 255, 0.06); padding: 8px; border-radius: 10px; }
    .info-label { font-size: 10px; color: #94a3b8; font-weight: 700; text-transform: uppercase; }
    .info-val { font-size: 14px; font-weight: 900; color: #facc15; }
    .info-desc { font-size: 12px; color: #94a3b8; line-height: 1.4; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 10px; }

    /* Hints Overlay */
    .hint-chip {
      position: absolute; bottom: 80px; right: 16px; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 12px; border-radius: 10px; font-size: 11px; color: #94a3b8; z-index: 10; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Header -->
  <header class="top-header">
    <div class="brand-box">
      <div>
        <div class="brand-title">CROSSY ROAD 3D</div>
        <div class="brand-subtitle">3D Model Viewer & Dev Studio</div>

    </div>

  <!-- Left Sidebar (Models Catalog) -->
  <aside class="sidebar">
    <div class="category-tabs">

  <!-- Right Info Panel -->
  <div class="info-panel">

  <div class="hint-chip">
    🖱️ ЛКМ — Вращение | ПКМ — Сдвиг | Колесо — Зум

  <!-- Bottom Toolbar -->
  <footer class="bottom-bar">
    <div class="toolbar-dock">
      <div class="tool-group">
        <button id="btn-spin" class="tool-btn active">🔄 360° Вращение</button>
        <button id="btn-hop" class="tool-btn">🦘 Тест прыжка</button>

      <div class="tool-group">
        <label style="font-size: 11px; font-weight: 700; color: #94a3b8;">Биом:</label>
        <select id="biome-select" class="tool-select">
          <option value="forest">🌲 Лес (Forest)</option>
          <option value="winter">❄️ Зима (Winter)</option>

          <option value="neon">⚡ Неон (Cyberpunk)</option>
        </select>

      <div class="tool-group">
        <label style="font-size: 11px; font-weight: 700; color: #94a3b8;">Свет:</label>
        <select id="light-select" class="tool-select">
          <option value="studio">💡 Студийный</option>
          <option value="sun">☀️ Солнечный день</option>
          <option value="sunset">🌅 Закат</option>
          <option value="cyber">🌆 Неоновый вечер</option>
        </select>

      <div class="tool-group">
        <button id="btn-grid" class="tool-btn active">📐 Сетка пола</button>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // === VOXEL PALETTE ===
    const VOXEL_PALETTE = {
      corgiOrange: 0xd97706, white: 0xffffff, capybaraBrown: 0x78350f, orangeFruit: 0xf97316,
      pigeonGrey: 0x64748b, purpleNeck: 0x8b5cf6, pizzaRed: 0xb91c1c, pizzaCheese: 0xfacc15,
      catOrange: 0xea580c, cardboard: 0xb45309, raccoonGrey: 0x475569, maskBlack: 0x0f172a,
      darkCharcoal: 0x1e293b, nosePink: 0xf472b6, greenLeaf: 0x16a34a, ghostYellow: 0xfbbf24,
      burlapBag: 0xd4b285, bagRope: 0x854d0e, capybaraCaramel: 0x925227, capybaraMuzzle: 0x542d13,
      capybaraPaws: 0x2b170a, pigeonFootRed: 0xf43f5e, deliveryRed: 0xdc2626, catStripe: 0x9a3412,
      boxFlap: 0x92400e, pizzaCrust: 0xb45309, pigeonTeal: 0x8b5cf6, catEye: 0xfacc15, capybaraDark: 0x1e293b
    };

    const matCache = new Map();
    function getMat(colorKeyOrHex, isGhost = false) {
      if (isGhost) {
        return new THREE.MeshLambertMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.45 });
      }
      const hex = typeof colorKeyOrHex === 'number' ? colorKeyOrHex : (VOXEL_PALETTE[colorKeyOrHex] ?? 0xffffff);
      if (!matCache.has(hex)) {
        matCache.set(hex, new THREE.MeshLambertMaterial({ color: hex }));
      }
      return matCache.get(hex);
    }

    const geoCache = new Map();
    function getGeo(w, h, d) {
      const key = `${w}_${h}_${d}`;
      if (!geoCache.has(key)) geoCache.set(key, new THREE.BoxGeometry(w, h, d));
      return geoCache.get(key);
    }

    function addVoxel(group, w, h, d, color, x, y, z, isGhost = false) {
      const mesh = new THREE.Mesh(getGeo(w, h, d), getMat(color, isGhost));
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
      return mesh;
    }

    // === CHARACTER FACTORIES ===
    function createCorgi(isGhost = false) {
      const g = new THREE.Group();
      // Paws
      addVoxel(g, 0.10, 0.03, 0.10, 'nosePink', -0.14, 0.015, 0.16, isGhost);
      addVoxel(g, 0.10, 0.12, 0.10, 'white', -0.14, 0.09, 0.16, isGhost);
      addVoxel(g, 0.10, 0.03, 0.10, 'nosePink', 0.14, 0.015, 0.16, isGhost);
      addVoxel(g, 0.10, 0.12, 0.10, 'white', 0.14, 0.09, 0.16, isGhost);
      addVoxel(g, 0.10, 0.03, 0.10, 'nosePink', -0.14, 0.015, -0.16, isGhost);
      addVoxel(g, 0.10, 0.12, 0.10, 'white', -0.14, 0.09, -0.16, isGhost);
      addVoxel(g, 0.10, 0.03, 0.10, 'nosePink', 0.14, 0.015, -0.16, isGhost);
      addVoxel(g, 0.10, 0.12, 0.10, 'white', 0.14, 0.09, -0.16, isGhost);
      // Body & belly
      addVoxel(g, 0.38, 0.22, 0.46, 'corgiOrange', 0, 0.25, -0.01, isGhost);
      addVoxel(g, 0.26, 0.04, 0.38, 'white', 0, 0.15, -0.01, isGhost);
      addVoxel(g, 0.34, 0.20, 0.12, 'white', 0, 0.26, 0.18, isGhost);
      addVoxel(g, 0.36, 0.20, 0.08, 'corgiOrange', 0, 0.26, -0.24, isGhost);
      addVoxel(g, 0.16, 0.12, 0.03, 'white', 0, 0.25, -0.28, isGhost);
      addVoxel(g, 0.12, 0.12, 0.10, 'corgiOrange', 0, 0.35, -0.27, isGhost);
      addVoxel(g, 0.08, 0.08, 0.05, 'white', 0, 0.37, -0.31, isGhost);
      // Collar & gold tag
      addVoxel(g, 0.32, 0.04, 0.22, 'pizzaRed', 0, 0.35, 0.15, isGhost);
      addVoxel(g, 0.04, 0.04, 0.03, 'pizzaCheese', 0, 0.33, 0.26, isGhost);
      // Head, muzzle, eyes & tongue
      addVoxel(g, 0.36, 0.26, 0.30, 'corgiOrange', 0, 0.48, 0.18, isGhost);
      addVoxel(g, 0.08, 0.22, 0.12, 'white', 0, 0.50, 0.28, isGhost);
      addVoxel(g, 0.20, 0.12, 0.14, 'white', 0, 0.42, 0.35, isGhost);
      addVoxel(g, 0.08, 0.06, 0.06, 'darkCharcoal', 0, 0.46, 0.42, isGhost);
      addVoxel(g, 0.06, 0.03, 0.08, 'nosePink', 0.03, 0.38, 0.41, isGhost);
      addVoxel(g, 0.05, 0.06, 0.04, 'darkCharcoal', -0.11, 0.51, 0.33, isGhost);
      addVoxel(g, 0.02, 0.02, 0.02, 'white', -0.11, 0.53, 0.35, isGhost);
      addVoxel(g, 0.05, 0.06, 0.04, 'darkCharcoal', 0.11, 0.51, 0.33, isGhost);
      addVoxel(g, 0.02, 0.02, 0.02, 'white', 0.11, 0.53, 0.35, isGhost);
      // Ears with pink lining
      addVoxel(g, 0.10, 0.16, 0.06, 'corgiOrange', -0.14, 0.66, 0.16, isGhost);
      addVoxel(g, 0.06, 0.08, 0.05, 'corgiOrange', -0.15, 0.76, 0.16, isGhost);
      addVoxel(g, 0.06, 0.14, 0.03, 'nosePink', -0.14, 0.67, 0.18, isGhost);
      addVoxel(g, 0.10, 0.16, 0.06, 'corgiOrange', 0.14, 0.66, 0.16, isGhost);
      addVoxel(g, 0.06, 0.08, 0.05, 'corgiOrange', 0.15, 0.76, 0.16, isGhost);
      addVoxel(g, 0.06, 0.14, 0.03, 'nosePink', 0.14, 0.67, 0.18, isGhost);
      return g;
    }

    function createPigeon(isGhost = false) {
      const g = new THREE.Group();
      addVoxel(g, 0.12, 0.03, 0.14, 'pigeonFootRed', -0.10, 0.015, 0.02, isGhost);
      addVoxel(g, 0.05, 0.10, 0.05, 'pigeonFootRed', -0.10, 0.07, 0.00, isGhost);
      addVoxel(g, 0.12, 0.03, 0.14, 'pigeonFootRed', 0.10, 0.015, 0.02, isGhost);
      addVoxel(g, 0.05, 0.10, 0.05, 'pigeonFootRed', 0.10, 0.07, 0.00, isGhost);
      addVoxel(g, 0.40, 0.28, 0.42, 'pigeonGrey', 0, 0.28, -0.04, isGhost);
      addVoxel(g, 0.30, 0.20, 0.12, 'white', 0, 0.28, 0.12, isGhost);
      addVoxel(g, 0.22, 0.08, 0.18, 'pigeonGrey', 0, 0.26, -0.28, isGhost);
      addVoxel(g, 0.18, 0.05, 0.12, 'darkCharcoal', 0, 0.24, -0.38, isGhost);
      addVoxel(g, 0.06, 0.22, 0.32, 'pigeonGrey', -0.22, 0.32, -0.04, isGhost);
      addVoxel(g, 0.07, 0.05, 0.22, 'darkCharcoal', -0.22, 0.28, -0.06, isGhost);
      addVoxel(g, 0.06, 0.08, 0.14, 'darkCharcoal', -0.20, 0.24, -0.20, isGhost);
      addVoxel(g, 0.06, 0.22, 0.32, 'pigeonGrey', 0.22, 0.32, -0.04, isGhost);
      addVoxel(g, 0.07, 0.05, 0.22, 'darkCharcoal', 0.22, 0.28, -0.06, isGhost);
      addVoxel(g, 0.06, 0.08, 0.14, 'darkCharcoal', 0.20, 0.24, -0.20, isGhost);
      addVoxel(g, 0.28, 0.12, 0.26, 'purpleNeck', 0, 0.43, 0.10, isGhost);
      addVoxel(g, 0.29, 0.04, 0.27, 'pigeonTeal', 0, 0.41, 0.10, isGhost);
      addVoxel(g, 0.26, 0.22, 0.26, 'pigeonGrey', 0, 0.56, 0.14, isGhost);
      addVoxel(g, 0.18, 0.06, 0.18, 'pigeonGrey', 0, 0.68, 0.14, isGhost);
      addVoxel(g, 0.03, 0.07, 0.07, 'orangeFruit', -0.14, 0.60, 0.17, isGhost);
      addVoxel(g, 0.04, 0.04, 0.04, 'darkCharcoal', -0.14, 0.60, 0.17, isGhost);
      addVoxel(g, 0.03, 0.07, 0.07, 'orangeFruit', 0.14, 0.60, 0.17, isGhost);
      addVoxel(g, 0.04, 0.04, 0.04, 'darkCharcoal', 0.14, 0.60, 0.17, isGhost);
      // Pizza slice
      addVoxel(g, 0.08, 0.04, 0.06, 'pizzaCheese', 0, 0.52, 0.26, isGhost);
      addVoxel(g, 0.16, 0.04, 0.06, 'pizzaCheese', 0, 0.52, 0.31, isGhost);
      addVoxel(g, 0.24, 0.04, 0.06, 'pizzaCheese', 0, 0.52, 0.36, isGhost);
      addVoxel(g, 0.26, 0.06, 0.06, 'pizzaCrust', 0, 0.53, 0.41, isGhost);
      addVoxel(g, 0.06, 0.02, 0.06, 'pizzaRed', -0.05, 0.54, 0.36, isGhost);
      addVoxel(g, 0.06, 0.02, 0.06, 'pizzaRed', 0.05, 0.54, 0.32, isGhost);
      return g;
    }

    function createCat(isGhost = false) {
      const g = new THREE.Group();
      // Box
      addVoxel(g, 0.52, 0.04, 0.52, 'cardboard', 0, 0.02, 0, isGhost);
      addVoxel(g, 0.52, 0.26, 0.04, 'cardboard', 0, 0.17, 0.24, isGhost);
      addVoxel(g, 0.52, 0.26, 0.04, 'cardboard', 0, 0.17, -0.24, isGhost);
      addVoxel(g, 0.04, 0.26, 0.44, 'cardboard', -0.24, 0.17, 0, isGhost);
      addVoxel(g, 0.04, 0.26, 0.44, 'cardboard', 0.24, 0.17, 0, isGhost);
      // Flaps & Stamp
      addVoxel(g, 0.46, 0.03, 0.10, 'boxFlap', 0, 0.29, 0.31, isGhost);
      addVoxel(g, 0.46, 0.03, 0.10, 'boxFlap', 0, 0.29, -0.31, isGhost);
      addVoxel(g, 0.22, 0.12, 0.02, 'deliveryRed', 0.10, 0.15, 0.262, isGhost);
      // Cat body & paws on rim
      addVoxel(g, 0.38, 0.22, 0.38, 'catOrange', 0, 0.20, 0, isGhost);
      addVoxel(g, 0.09, 0.07, 0.10, 'white', -0.13, 0.32, 0.24, isGhost);
      addVoxel(g, 0.09, 0.07, 0.10, 'white', 0.13, 0.32, 0.24, isGhost);
      // Head, ears, eyes
      addVoxel(g, 0.34, 0.26, 0.30, 'catOrange', 0, 0.44, 0.06, isGhost);
      addVoxel(g, 0.05, 0.04, 0.04, 'nosePink', 0, 0.42, 0.25, isGhost);
      addVoxel(g, 0.05, 0.06, 0.04, 'catEye', -0.08, 0.46, 0.212, isGhost);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f19);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(3.2, 2.5, 4.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.5, 0);
    controls.maxPolarAngle = Math.PI / 2 + 0.05; // prevent going below ground

    // Lights
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x1e293b, 0.7);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.4);
    fillLight.position.set(-6, 4, -4);
    scene.add(fillLight);

    // Floor Pedestal & Grid
    const pedestalGeo = new THREE.CylinderGeometry(2.4, 2.5, 0.1, 48);
    const pedestalMat = new THREE.MeshLambertMaterial({ color: 0x111827 });
    const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
    pedestal.position.y = -0.05;
    pedestal.receiveShadow = true;
    scene.add(pedestal);

    const grid = new THREE.GridHelper(5, 20, 0x0284c7, 0x1e293b);
    grid.position.y = 0.002;
    scene.add(grid);

    // Current State
    let activeCategory = 'chars';
    let currentModelId = 'corgi';
    let currentMesh = null;
    let autoSpin = true;
    let hopTest = false;
    let ghostMode = false;
    let currentBiome = 'forest';

    // Model Mount Node
    const modelRoot = new THREE.Group();
    scene.add(modelRoot);

    function loadModel(id) {
      currentModelId = id;
      const def = MODELS.find(m => m.id === id);
      if (!def) return;

      while (modelRoot.children.length > 0) {
        modelRoot.remove(modelRoot.children[0]);
      }

      currentMesh = def.create(currentBiome, ghostMode);
      modelRoot.add(currentMesh);

      // Center model
      const box = new THREE.Box3().setFromObject(currentMesh);
      const center = box.getCenter(new THREE.Vector3());
      currentMesh.position.x = -center.x;
      currentMesh.position.z = -center.z;
      currentMesh.position.y = -box.min.y;

      // Update Info Panel
      document.getElementById('info-title').textContent = `${def.icon} ${def.name}`;
      document.getElementById('info-category').textContent = def.cat.toUpperCase();
      document.getElementById('info-voxels').textContent = String(def.voxels);
      document.getElementById('info-dims').textContent = def.dims;
      document.getElementById('info-desc').textContent = def.desc;

      // Update sidebar buttons
      document.querySelectorAll('.model-card-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.id === id);
      });
    }

    function renderSidebar() {
      const listEl = document.getElementById('model-list');
      listEl.innerHTML = '';
      const filtered = MODELS.filter(m => m.cat === activeCategory);

      filtered.forEach(m => {
        const btn = document.createElement('button');
        btn.className = `model-card-btn ${m.id === currentModelId ? 'active' : ''}`;
        btn.dataset.id = m.id;
        btn.innerHTML = `
          <div class="model-card-title">
            <span style="font-size: 18px;">${m.icon}</span>
            <span>${m.name}</span>
          </div>
          <span class="model-card-badge">${m.voxels} vx</span>
        `;
        btn.addEventListener('click', () => loadModel(m.id));
        listEl.appendChild(btn);
      });
    }

    // Category Tabs
    document.querySelectorAll('.cat-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        activeCategory = tab.dataset.cat;
        renderSidebar();
        const first = MODELS.find(m => m.cat === activeCategory);
        if (first) loadModel(first.id);
      });
    });

    // Toolbar Controls
    const btnSpin = document.getElementById('btn-spin');
    btnSpin.addEventListener('click', () => {
      autoSpin = !autoSpin;
      btnSpin.classList.toggle('active', autoSpin);
    });

    const btnHop = document.getElementById('btn-hop');
    btnHop.addEventListener('click', () => {
      hopTest = !hopTest;
      btnHop.classList.toggle('active', hopTest);
      if (!hopTest && modelRoot) {
        modelRoot.scale.set(1, 1, 1);
        modelRoot.position.y = 0;
      }
    });

    const btnGhost = document.getElementById('btn-ghost');
    btnGhost.addEventListener('click', () => {
      ghostMode = !ghostMode;
      btnGhost.classList.toggle('active', ghostMode);
      loadModel(currentModelId);
    });

    const biomeSelect = document.getElementById('biome-select');
    biomeSelect.addEventListener('change', (e) => {
      currentBiome = e.target.value;
      loadModel(currentModelId);
    });

    const lightSelect = document.getElementById('light-select');
    lightSelect.addEventListener('change', (e) => {
      const v = e.target.value;
      if (v === 'studio') {
        scene.background.set(0x0b0f19);
        hemiLight.color.set(0xffffff);
        dirLight.color.set(0xffffff);
        fillLight.color.set(0x38bdf8);
      } else if (v === 'sun') {
        scene.background.set(0x38bdf8);
        hemiLight.color.set(0xbae6fd);
        dirLight.color.set(0xffedd5);
        fillLight.color.set(0x60a5fa);
      } else if (v === 'sunset') {
        scene.background.set(0x4c1d95);
        hemiLight.color.set(0xf472b6);
        dirLight.color.set(0xf97316);
        fillLight.color.set(0x818cf8);
      } else if (v === 'cyber') {
        scene.background.set(0x050510);
        hemiLight.color.set(0x06b6d4);
        dirLight.color.set(0xd946ef);
        fillLight.color.set(0x3b82f6);
      }
    });

    const btnGrid = document.getElementById('btn-grid');
    btnGrid.addEventListener('click', () => {
      grid.visible = !grid.visible;
      btnGrid.classList.toggle('active', grid.visible);
    });

    const btnResetCam = document.getElementById('btn-reset-cam');
    btnResetCam.addEventListener('click', () => {
      camera.position.set(3.2, 2.5, 4.0);
      controls.target.set(0, 0.5, 0);
    });

    // Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation Loop
    let clock = new THREE.Clock();
    let hopTimer = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      controls.update();

      if (autoSpin) {
        modelRoot.rotation.y += delta * 0.8;
      }

      // Procedural Hop with Squash & Stretch
      if (hopTest) {
        hopTimer += delta * 2.8;
        const cycle = hopTimer % 1.0;
        const hopY = Math.sin(cycle * Math.PI) * 0.7;
        modelRoot.position.y = Math.max(0, hopY);

        if (cycle < 0.2) {
          // Takeoff squash
          const t = cycle / 0.2;
          modelRoot.scale.y = 1.0 - (1.0 - 0.72) * (1.0 - t);
          modelRoot.scale.x = 1.0 / Math.sqrt(modelRoot.scale.y);
          modelRoot.scale.z = modelRoot.scale.x;
        } else if (cycle <= 0.8) {
          // Flight stretch
          modelRoot.scale.y = 1.25;
          modelRoot.scale.x = 1.0 / Math.sqrt(1.25);
          modelRoot.scale.z = modelRoot.scale.x;
        } else {
          // Landing recovery
          modelRoot.scale.set(1, 1, 1);
        }
      }

      renderer.render(scene, camera);
    }

    // Init
    renderSidebar();
    loadModel('corgi');
    animate();
  </script>
</body>
</html>
